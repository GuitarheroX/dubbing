[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dubbing"
version = "0.1.0"
description = "日语歌歌词汉译配流水线：perceiver 体会意境，writer 写词，reviewer 规则核对可唱性"
requires-python = ">=3.11"
dependencies = ["pyyaml>=6", "requests>=2.31"]

[project.optional-dependencies]
dev = ["pytest>=8"]
#: workflow-RAG 才需要：本地 Chroma 向量库（嵌入服务在 GPU 服务器上，单独部署）
rag = ["chromadb>=1.0"]

[project.scripts]
dubbing = "dubbing.cli:main"

[tool.setuptools]
packages = ["dubbing", "dubbing.rag"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
