[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dubbing"
version = "0.1.0"
description = "日语歌歌词汉译配流水线：A 体会意境，B 按段写词，C 规则核对可唱性"
requires-python = ">=3.11"
dependencies = ["pyyaml>=6", "requests>=2.31"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
dubbing = "dubbing.cli:main"

[tool.setuptools]
packages = ["dubbing"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
